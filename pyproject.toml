[project]
name = "colpali-rag"
version = "0.1.0"
description = "Production-grade ColPali RAG: visual document retrieval (late interaction) + hybrid text retrieval + RAG answers served via local kilo LLMs (OmniRoute)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "colpali-engine>=0.3",
    "transformers>=4.50",
    "accelerate>=1.0",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "pymupdf>=1.24",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=1.40",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "pillow>=10.0",
    # CUDA builds (the plain PyPI wheels are CPU-only on Windows)
    "torch==2.13.0+cu126",
    "torchvision==0.28.0+cu126",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
colpali-ingest = "colpali_rag.ingest:cli_main"
colpali-api = "colpali_rag.api:main"
colpali-eval = "colpali_rag.eval:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
index-strategy = "unsafe-best-match"

# CUDA build of torch (the plain PyPI wheel is CPU-only on Windows).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"

[tool.pytest.ini_options]
testpaths = ["tests"]