# ColPali RAG tunables.
# Each key must match the Settings field name in src/colpali_rag/config.py
# (e.g. generation_mode, not mode). Precedence: CLI/init args > config.yaml
# > .env > defaults.
model:
  colpali_model: "vidore/colqwen2-v1.0-hf"  # visual retriever (late interaction, MaxSim; fits 6GB VRAM fp16)
  text_embed_model: "BAAI/bge-large-en-v1.5"  # dense text embeddings (1024d, fastembed)
  text_sparse_model: "Qdrant/bm25"             # sparse text leg (fastembed BM25, CPU)
  device: "auto"                       # auto | cuda | cpu
  embed_batch_size: 2

paths:
  corpus_dir: data/corpus
  pages_dir: data/pages
  qdrant_path: data/qdrant
  hf_cache: data/hf-cache
  manifests_dir: data/manifests
  jobs_db: data/ingest_jobs.db     # durable ingest job log (survives restarts)
  log_file: data/logs/app.log      # rotating file log (gitignored)

security:
  cors_origins: ["http://localhost:8000", "http://127.0.0.1:8000"]
  rate_limit_per_minute: 60         # /v1/query per client IP
  rate_limit_ingest_per_minute: 10  # /v1/ingest per client IP
  max_upload_mb: 50                 # PDF upload cap (413 beyond this)
  max_concurrent_ingests: 2         # GPU-friendly cap; extra uploads queue (status: queued)
  max_concurrent_queries: 2         # cap concurrent GPU retrievals per process
  log_level: INFO

vectordb:
  collection: docs
  colpali_dim: 128
  dense_dim: 1024
  distance: Dot
  # Hosted Qdrant? Do NOT put qdrant_url / qdrant_api_key here - yaml values
  # become constructor args and would shadow the .env credentials. Instead add
  # QDRANT_URL + QDRANT_API_KEY to .env (values are secrets, see .env.example).

retrieval:
  top_k: 8
  colpali_prefetch: 30
  dense_prefetch: 60
  sparse_prefetch: 60
  rrf_k: 60

generation:
  # generation_mode lives in .env (GENERATION_MODE) - a per-deployment switch
  # (text | extractive | vision), NOT here: yaml values become constructor args
  # and would shadow the .env setting (same rule as qdrant_url above).
  generation_top_pages: 3
  excerpt_chars: 16000
  temperature: 0.2
  max_tokens: 700
  generation_retries: 2            # extra gateway attempts on error/empty reply
  generation_retry_delay: 2.0      # seconds between retries

ocr:
  ocr_enabled: false        # true = OCR pages with no embedded text (rapidocr)
  min_text_chars: 40

runtime:
  warmup_on_start: true     # load embedders at boot so the first query is instant (demo-safe)